[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aize"
version = "0.1.0"
description = "Minimal MINIX-style message-passing AIze core with CLI inspection."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aize = "cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["kernel", "goal", "cli"]
py-modules = ["agent_api"]

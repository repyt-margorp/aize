[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aize"
version = "0.1.0"
description = "Minimal MINIX-style message-passing AIze core with CLI inspection."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aize = "new_aize.cli:main"
new-aize = "new_aize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aize"
version = "0.1.0"
description = "Minimal MINIX-style message-passing AIze core with CLI inspection."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aize = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "agent_api",
  "agents",
  "cli",
  "cli_console",
  "cli_render",
  "cli_workers",
  "envelope",
  "model",
  "schedule_resolvers",
  "store",
  "store_auth",
  "store_defs",
  "store_dispatch",
  "store_dispatch_requests",
  "store_files",
  "store_message",
  "store_prompts",
  "store_query",
  "store_session",
  "store_session_log",
]
